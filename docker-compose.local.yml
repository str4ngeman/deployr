services:
  deployr:
    build: .
    ports:
      - "4199:4199"
    env_file:
      - .env
    environment:
      PORT: 4199
      NODE_ENV: production
      DOCKER_ENABLED: "true"
    volumes:
      - ${FILE_ROOT}:${FILE_ROOT}:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - deployr-data:/app/data
    restart: unless-stopped

volumes:
  deployr-data:
