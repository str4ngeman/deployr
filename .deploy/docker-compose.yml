services:
  deployr:
    image: ${DEPLOYR_IMAGE:-ghcr.io/str4ngeman/deployr:latest}
    container_name: deployr
    ports:
      - "4199:4199"
    environment:
      PORT: 4199
      FILE_ROOT: /opt
      NODE_ENV: production
      DOCKER_ENABLED: "true"
      DATA_DIR: /app/data
    volumes:
      - /opt:/opt:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - deployr-data:/app/data
    restart: unless-stopped

volumes:
  deployr-data:
