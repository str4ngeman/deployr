services:
  deployr:
    image: ${DEPLOYR_IMAGE:-ghcr.io/str4ngeman/deployr:latest}
    container_name: deployr
    ports:
      - "4199:4199"
    environment:
      PORT: 4199
      FILE_ROOT: /opt
      NODE_ENV: production
      DOCKER_ENABLED: "true"
      DATA_DIR: /app/data
    volumes:
      - /opt:/opt:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - deployr-data:/app/data
    mem_limit: 256m
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4199/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  deployr-data:
